name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build merchant interface
        run: |
          npm ci
          npm run build

      - name: Install CPU-only development dependencies
        run: pip install -e '.[dev]'

      - name: Verify application without loading models
        run: |
          ruff check .
          mypy src
          pytest

      - name: Validate Dockerfile
        uses: docker/setup-buildx-action@v3

      - name: Check Docker build definition
        run: docker buildx build --check --file Dockerfile .

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The baked image is large; free preinstalled tooling and move Docker
      # storage to /mnt so model layers do not exhaust the root disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          swap-storage: false
          docker-images: true

      - name: Move Docker storage to /mnt
        run: |
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require custom model coordinates
        env:
          YOLO_MODEL_REPO: ${{ vars.YOLO_MODEL_REPO }}
          YOLO_MODEL_REV: ${{ vars.YOLO_MODEL_REV }}
        run: |
          test -n "$YOLO_MODEL_REPO"
          test -n "$YOLO_MODEL_REV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            YOLO_MODEL_REPO=${{ vars.YOLO_MODEL_REPO }}
            YOLO_MODEL_REV=${{ vars.YOLO_MODEL_REV }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
