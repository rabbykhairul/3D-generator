[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "eyewear-vto-3d"
version = "0.1.0"
description = "Multi-view eyewear image-to-3D generation service"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=11,<12",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1",
  "structlog>=24.4,<26",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eyewear_vto"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["eyewear_vto"]
